<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Diccionario bilingüe / Bilingual dictionary</title><style>body{font:16px/1.6 system-ui,sans-serif;color:#183b32;max-width:1250px;margin:auto;padding:24px;background:#f7faf8}a{color:#135f4b}h1{font-size:2rem}h2{font-size:1.3rem}table{border-collapse:collapse;width:100%;background:white}th,td{padding:12px;border:1px solid #d6e2da;text-align:left;vertical-align:top;overflow-wrap:anywhere}th{background:#e7f0eb}code{overflow-wrap:anywhere}input{font:inherit;padding:12px;width:min(90%,700px)}.scroll{overflow:auto}small{font-size:.9rem}pre{white-space:pre-wrap;background:#e7f0eb;padding:16px}table{table-layout:fixed;min-width:900px}th:nth-child(1){width:20%}th:nth-child(2),th:nth-child(3){width:34%}th:nth-child(4){width:12%}</style><p><a href="Agro2013/index.html#dataset">Visor / Viewer</a> · <a href="data/dictionary_bilingual.csv" download>CSV</a> · <a href="data/dictionary_bilingual.parquet" download>Parquet</a></p><h1>Diccionario / Dictionary</h1><label for="q">Buscar código o definición / Search code or definition</label><br><input id="q" type="search"><p id="count"></p><div class="scroll"><table><thead><tr><th>Código / Code</th><th>Español</th><th>English</th><th>Unidad / Unit</th></tr></thead><tbody id="body"></tbody></table></div><button id="more" style="font:inherit;padding:12px;margin:20px 0">Mostrar más / Show more</button><script src="data/dictionary-browser.js"></script><script>
let limit=50;const q=document.querySelector('#q'),body=document.querySelector('#body');
const normalized=s=>s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
const searchable=CNA_DICTIONARY.map(r=>normalized(r.code+' '+r.definition_es+' '+r.definition_en));
function draw(){const query=normalized(q.value),hits=CNA_DICTIONARY.filter((r,i)=>!query||searchable[i].includes(query));body.replaceChildren();for(const r of hits.slice(0,limit)){const tr=document.createElement('tr');for(const key of ['code','definition_es','definition_en','unit_en']){const td=document.createElement('td');td.textContent=r[key];tr.append(td)}body.append(tr)}document.querySelector('#count').textContent=hits.length.toLocaleString('en-US')+' resultados / results · '+Math.min(limit,hits.length)+' visibles / shown';document.querySelector('#more').hidden=limit>=hits.length;}
q.addEventListener('input',()=>{limit=50;draw()});document.querySelector('#more').onclick=()=>{limit+=50;draw()};draw();</script></html>
